# ABOUTME: Routes this repo's sdlc runs to the Codex harness (Story 20.7-005).
# ABOUTME: Precedence: --harness flag > this file > registry default > built-in claude.
#
# Runs here dispatch through `scripts/codex-build-adapter.sh`, which feeds the
# assembled prompt to `codex exec` and forwards the harness-neutral
# <<<RESULT_JSON>>> contract back. Zero `claude` processes are spawned.
#
# Accepted trade-offs — codex declares these capabilities false in the registry:
#   * no worktree isolation → stories build in the shared checkout, not per-story
#     worktrees, so overlapping work is not physically separated
#   * no parallel execution  → builds run serially regardless of --concurrency
#   * no usage tracking      → no token/cost rows, so Epic-14's budget gate and
#     Epic-28's predictor have nothing to meter or calibrate on for this repo
#   * no rate-limit awareness → no auto-park/auto-resume on a quota window
#
# The model comes from your ~/.codex/config.toml, not from here — the adapter runs
# plain `codex exec` with no `--model`, which is what keeps it working on any
# authenticated Codex (issue #228). Per-stage model routing is opt-in in the
# registry's `codex` entry.
#
# `sdlc fix` honours this routing as of controller v2.42.11 (issue #551). The
# `/fix-issue` slash command inside a Claude session does not and cannot — it
# spawns agents in-process via the Agent tool, a Claude Code primitive with no CLI
# equivalent (the Story 20.6-002 boundary).
#
# Per-role overrides are available if a single role should stay on claude, e.g.:
#   harness:
#     default: codex
#     roles:
#       review: claude    # roles: build | coverage (alias: qa) | review | merge | docs
harness:
  default: codex
